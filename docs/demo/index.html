<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Community Garden | Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9f0e9;
        color: #193c32;
        font:
          17px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: 46px auto;
        padding: 42px 48px;
        border-radius: 24px;
        background: #fff;
      }
      header {
        border-bottom: 1px solid #c9dbd0;
        padding-bottom: 24px;
        margin-bottom: 24px;
      }
      small {
        font-weight: 700;
        color: #437760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 49px;
        line-height: 1.05;
        margin: 12px 0;
      }
      p {
        margin: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 13px 16px;
        border-bottom: 1px solid #d9e6dd;
      }
      th {
        background: #dceee4;
      }
      td:last-child {
        font-weight: 650;
      }
      footer {
        color: #437760;
        margin-top: 24px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main
      ><header
        ><small>Community Garden</small><h1>Seedling inventory</h1
        ><p>Spring planting · Demonstration data</p></header
      >
      <table
        ><thead
          ><tr><th>Plant</th><th>Location</th><th>Available</th></tr></thead
        ><tbody>
          <tr><td>Basil</td><td>Greenhouse A</td><td>24 trays</td></tr>
          <tr><td>Cherry tomato</td><td>Greenhouse B</td><td>16 trays</td></tr>
          <tr><td>Snap pea</td><td>Outdoor bench</td><td>12 trays</td></tr></tbody
        ></table
      >
      <footer>Sample inventory for the Agent Chrome MCP walkthrough</footer></main
    >
  </body>
</html>
