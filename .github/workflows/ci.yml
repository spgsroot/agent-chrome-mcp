name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:versions
      - run: pnpm check:tool-docs
      - run: pnpm test:clean-script
      - run: pnpm test:extension-package
      - run: pnpm test:portable-launcher
      - run: pnpm lint
      - run: pnpm --filter @ethanwilkins/chrome-mcp-server-2026 test --reporter=default
      - run: pnpm --filter @ethanwilkins/mcp-chrome-bridge-2026 test:coverage
      - run: pnpm build
      - run: pnpm check:phase8:built
